<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Jargon</title>
    <meta
      name="description"
      content="Jargon is an ultra-minimal AI tutor. Chat, run code, learn."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
    <!-- Design-system type: Manrope (UI) + Geist Mono (code, counters, timestamps).
         Both are SELF-HOSTED and imported from main.tsx. Nothing in this head may
         reference a third-party origin: a render-blocking <link> to a host we do not
         control holds the first paint hostage to that host being reachable, and school
         networks block plenty of hosts. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("jargon-theme") || "system";
          var d =
            m === "dark" ||
            (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (d) r.classList.add("dark");
          r.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
