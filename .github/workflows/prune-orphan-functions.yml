name: Prune orphan edge functions (one-shot)

# R102 follow-up. Three edge functions are deployed to the project with NO SOURCE IN THIS
# REPO — leftovers from earlier probing:
#
#   key-probe-oneoff    (2026-06, checking which key a function receives)
#   ops-probe-r49       (R49, probing admin-ops behaviour)
#   deploy-probe-r90    (R90, testing the MCP deploy channel)
#
# They are inert: nothing in the repo, in cron, or in any other function references them.
# But an undocumented deployed function is a surface nobody is watching, so they go.
#
# This workflow exists because the CLI needs an account access token, which lives only as
# a repository secret. It is MANUAL-ONLY (workflow_dispatch) and it is a ONE-SHOT: delete
# this file once the run is green. It is deliberately NOT wired to any push trigger, and
# it deletes only the three names hardcoded below — never a list read from anywhere else.

on:
  workflow_dispatch: {}

concurrency:
  group: prune-orphan-functions
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: qztpieiizmiayzjhezwh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is required."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Delete the three orphan functions
        run: |
          set -u
          # Idempotent: a function that is already gone is a success, not a failure, so
          # re-running this workflow can never turn red for having already worked.
          for fn in key-probe-oneoff ops-probe-r49 deploy-probe-r90; do
            echo "--- $fn"
            if supabase functions delete "$fn" --project-ref "$PROJECT_REF" 2>&1 | tee /tmp/out; then
              echo "deleted $fn"
            elif grep -qiE "not found|does not exist" /tmp/out; then
              echo "$fn was already absent — nothing to do"
            else
              echo "::error::failed to delete $fn"
              exit 1
            fi
          done

      - name: Show what is left
        run: |
          supabase functions list --project-ref "$PROJECT_REF"
