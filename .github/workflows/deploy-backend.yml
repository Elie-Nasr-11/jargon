name: Deploy backend (Supabase)

# Deploys the curriculum-redesign backend to Supabase:
#   - the additive 20260629000000_curriculum_authoring migration (idempotent), applied
#     via the Supabase Management API database/query endpoint
#   - the `curriculum-admin` and `chat` edge functions, via the Supabase CLI
#
# Triggers on a push to the feature branch (so the backend lands before the frontend
# `main` fast-forward) and on manual dispatch.
#
# Required repository secret (the only one):
#   SUPABASE_ACCESS_TOKEN   Supabase account access token
#                           (Dashboard > Account > Access Tokens > Generate new token).
#                           Used both for the Management API migration and the CLI deploy.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "supabase/functions/curriculum-admin/**"
      - "supabase/functions/chat/**"
      - "supabase/functions/assessment-admin/**"
      - "supabase/functions/voice-session/**"
      - "supabase/functions/run/**"
      - "supabase/functions/resource-processing/**"
      - "supabase/functions/admin-ops/**"
      - "supabase/functions/submission-maintenance/**"
      - "supabase/functions/artifact-live/**"
      - "supabase/functions/cognition-scorer/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: qztpieiizmiayzjhezwh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Depth 2 so the migration step can diff against the parent commit and skip
          # the replay on function-only deploys (see that step's comment).
          fetch-depth: 2

      - name: Require access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is required."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned (not "latest") so setup-cli skips the GitHub "resolve latest release" API
          # call, which is prone to rate-limit failures on shared runners.
          version: 2.109.0

      - name: Apply additive migrations (Management API; idempotent)
        run: |
          # R50b: function-only pushes skip the replay entirely. The replay exists to
          # CONVERGE SCHEMA when migrations change; running it on every deploy made
          # function fixes hostage to the Management API's database/query endpoint,
          # which timed out (HTTP 544) for three straight attempts on 2026-08-20 and
          # blocked a functions-only deploy. Manual dispatch and unknown parents still
          # replay (safe default).
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse -q --verify HEAD^ >/dev/null 2>&1; then
            if ! git diff --name-only HEAD^ HEAD | grep -q '^supabase/migrations/'; then
              echo "No migration changes in this push — skipping the replay."
              exit 0
            fi
          fi
          for f in \
            supabase/migrations/20260629000000_curriculum_authoring.sql \
            supabase/migrations/20260630000000_tutor_pedagogy.sql \
            supabase/migrations/20260701000000_checkpoint_required.sql \
            supabase/migrations/20260701120000_checkpoints_unified.sql \
            supabase/migrations/20260701130000_checkpoints_dualwrite.sql \
            supabase/migrations/20260702000000_tutor_v2_step_state.sql \
            supabase/migrations/20260628000000_canvas_integration.sql \
            supabase/migrations/20260705000000_mode_foundation.sql \
            supabase/migrations/20260710000000_lesson_templates.sql \
            supabase/migrations/20260715000000_class_scoping.sql \
            supabase/migrations/20260720000000_notifications.sql \
            supabase/migrations/20260725000000_recipient_grade_guard.sql \
            supabase/migrations/20260726000000_notification_writers.sql \
            supabase/migrations/20260727000000_submission_path_binding.sql \
            supabase/migrations/20260728000000_submission_retention_scan.sql \
            supabase/migrations/20260729000000_session_holds.sql \
            supabase/migrations/20260730000000_review_sessions.sql \
            supabase/migrations/20260731000000_notifications_realtime.sql \
            supabase/migrations/20260731100000_memory_v1.sql \
            supabase/migrations/20260801000000_comms_foundation.sql \
            supabase/migrations/20260802000000_comms_dm_notify.sql \
            supabase/migrations/20260803000000_entity_comments.sql \
            supabase/migrations/20260711000000_itf_book_f_seed.sql \
            supabase/migrations/20260712000000_retire_demo_catalog.sql \
            supabase/migrations/20260713000000_book_f_only_catalog.sql \
            supabase/migrations/20260801000000_mvp_demo_catalog.sql \
            supabase/migrations/20260815000000_flow_v3_session_nav.sql \
            supabase/migrations/20260820000000_artifact_resources.sql \
            supabase/migrations/20260901000000_live_artifact_scoping.sql \
            supabase/migrations/20260910000000_memory_v2.sql \
            supabase/migrations/20260915000000_student_profile.sql \
            supabase/migrations/20260920000000_session_running_summary.sql \
            supabase/migrations/20260925000000_learning_framework.sql \
            supabase/migrations/20260926000000_model_usage_routing_task.sql \
            supabase/migrations/20260930000000_brain_mastery.sql \
            supabase/migrations/20261001000000_practice_items.sql \
            supabase/migrations/20261002000000_systems_lab_demo.sql \
            supabase/migrations/20261003000000_campus_trigonometry.sql \
            supabase/migrations/20261003100000_campus_biology.sql \
            supabase/migrations/20261003200000_campus_history.sql \
            supabase/migrations/20261003300000_campus_wiring.sql \
            supabase/migrations/20261004000000_lesson_figures.sql \
            supabase/migrations/20261005000000_campus_neuroanatomy.sql \
            supabase/migrations/20261010000000_class_sections.sql \
            supabase/migrations/20261015000000_step_work_links.sql \
            supabase/migrations/20261102000000_r97_idea_mastery_backfill.sql \
            supabase/migrations/20261103000000_r100_cognition_probes.sql \
            supabase/migrations/20261104000000_r101_sweep_aging.sql \
            supabase/migrations/20261105000000_r103_cognitive_load.sql ; do
            echo "Applying $f"
            # Body goes through a temp file, not a shell argument: large seed migrations
            # (e.g. the Book F content seed, ~254KB) exceed the kernel's per-argument
            # limit (~128KB) and fail exec with "Argument list too long".
            body="$(mktemp)"
            jq -Rs '{query: .}' "$f" > "$body"
            resp="$(mktemp)"
            # R50b: the endpoint throws transient gateway timeouts (HTTP 544 observed);
            # retry each idempotent migration up to 3 times with backoff before failing.
            code="000"
            for attempt in 1 2 3; do
              code="$(curl -sS -o "$resp" -w '%{http_code}' \
                -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary "@$body")"
              echo "HTTP $code (attempt $attempt)"
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                break
              fi
              cat "$resp"; echo
              [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
            done
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Migration query failed for $f (HTTP $code) after 3 attempts."
              exit 1
            fi
            echo "Applied $f."
          done

      - name: Deploy edge functions
        run: |
          # R55 incident (2026-08-21): GoTrue signs user access tokens with the
          # asymmetric ES256 key (kid published in the project JWKS), but the edge
          # functions GATEWAY intermittently rejects those tokens with
          # UNAUTHORIZED_ASYMMETRIC_JWT — its JWKS cache went stale after the
          # 2026-08-20 platform outage/restart. Every user-token function therefore
          # deploys with --no-verify-jwt: the gateway check was a redundant layer —
          # each of these functions resolves the actor from the Authorization JWT
          # internally (GoTrue/PostgREST + RLS) and refuses junk with a typed 4xx
          # (the smoke step below proves that on every deploy). Revert the flags
          # when Supabase confirms the gateway validates ES256 reliably.
          supabase functions deploy curriculum-admin --project-ref "$PROJECT_REF" --no-verify-jwt
          # chat bundles SERVER-SIDE (--use-api), unlike every other function here.
          #
          # 2026-09-01, run #163: the first deploy after the access token was rotated got
          # through curriculum-admin (181KB source, 80kB bundled) and then died on chat
          # with `failed to bundle function: exit 135` — 128+7, a SIGBUS out of the local
          # edge-runtime Docker bundler. chat is 426KB, five times the next largest
          # function, and it crossed 416KB -> 426KB in R91; nothing else in this list is
          # anywhere near that. --use-api hands the bundling to Supabase instead of doing
          # it in a container on the runner, which is the one part of the path that
          # failed. The rest stay on the Docker bundler: it worked for them in the same
          # run, and changing what is not broken here costs a deploy to find out.
          supabase functions deploy chat --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy assessment-admin --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy voice-session --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy run --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy resource-processing --project-ref "$PROJECT_REF" --no-verify-jwt
          # admin-ops now auto-deploys (actively developed as of the Live tab); it stays JWT- +
          # actor-access-gated internally. admin-seed remains manual (account provisioning).
          supabase functions deploy admin-ops --project-ref "$PROJECT_REF" --no-verify-jwt
          # submission-maintenance is system-only (accepts ONLY the service-role bearer); invoked
          # by the scheduled submission-maintenance.yml workflow.
          supabase functions deploy submission-maintenance --project-ref "$PROJECT_REF"
          # artifact-live: P8 live mentor-generated artifacts — student-JWT identity,
          # service-role writes (student_private lesson_resources rows + storage).
          supabase functions deploy artifact-live --project-ref "$PROJECT_REF" --no-verify-jwt
          # cognition-scorer: the rubric judge. It shipped v3->v11 through the MCP deploy
          # channel while every other function came through here, which meant a scorer
          # change could reach production without the migration replay that a schema
          # change beside it needs. It resolves its own actor (a user JWT for the teacher
          # actions, the sweep key for the cron), so --no-verify-jwt matches how it has
          # always been deployed.
          supabase functions deploy cognition-scorer --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Smoke-check deployed functions answer typed responses
        run: |
          # Incident guard (Aug 16–20 chat outage): a deploy left the chat function
          # answering bare runtime 500s on every POST — no function logs, no telemetry,
          # nothing red anywhere — until a student hit it days later. A broken-on-arrival
          # function must fail THIS run instead: a garbage POST has to come back as the
          # function's own TYPED JSON refusal (4xx), never a bare 5xx / non-JSON body.
          ANON_KEY="$(curl -sS "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | jq -r '.[] | select(.name == "anon") | .api_key')"
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "::error::Could not resolve the anon key for the smoke check."
            exit 1
          fi
          for fn in chat assessment-admin curriculum-admin; do
            resp="$(mktemp)"
            code="$(curl -sS -o "$resp" -w '%{http_code}' \
              -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}" \
              -H "Authorization: Bearer ${ANON_KEY}" \
              -H "Content-Type: application/json" \
              --data '"not-an-object"')"
            body="$(cat "$resp")"
            echo "${fn}: HTTP ${code} — ${body:0:200}"
            if [ "$code" -ge 500 ] || [ "$code" -lt 200 ]; then
              echo "::error::${fn} answered HTTP ${code} to the smoke probe — the deployed function is not serving."
              exit 1
            fi
            if ! echo "$body" | jq -e . > /dev/null 2>&1; then
              echo "::error::${fn} smoke response is not JSON — a bare runtime answer, not the function's typed refusal."
              exit 1
            fi
          done
